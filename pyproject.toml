[project]
name = "psycopredict"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Django==6.1.3",
    "pandas==3.1.1",
    "numpy==2.5.5",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
    "groq==1.7.0",
    "gunicorn==27.0.1",
    "whitenoise==6.12.0",
    "dj-database-url==3.1.2",
    "psycopg2-binary==2.9.13",
    "python-dotenv==1.2.4"
]

[tool.vercel.scripts]
build = "python manage.py migrate --noinput"